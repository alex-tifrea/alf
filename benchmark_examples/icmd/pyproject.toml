[project]
name = "alf-icmd-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.14.1"
description = "Fixed-pool ICMD regression benchmarks using ALF"
dependencies = ["alf-core",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "catboost==1.2.10",
    "torch==2.11.0",
    "matplotlib==3.10.8",
    "pyarrow==23.0.1",
    "threadpoolctl==3.6.0",
]

[project.scripts]
alf-icmd = "alf_icmd.runner:main"
alf-icmd-report = "alf_icmd.report:main"
alf-icmd-skew = "alf_icmd.skew_suite:main"
alf-icmd-skew-report = "alf_icmd.skew_report:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
alf-core = { path = "../../core", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
